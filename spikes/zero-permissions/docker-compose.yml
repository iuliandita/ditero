# Spike A infra: Postgres (logical replication) + zero-cache.
# This turn we only bring up upstream-db (push schema + seed).
# zero-cache is wired but started later, once the /query + /mutate endpoints exist.
services:
  upstream-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ditero_spike
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    command: postgres -c wal_level=logical
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - spike-pg:/var/lib/postgresql

  zero-cache:
    image: rocicorp/zero:1.7.0
    depends_on:
      upstream-db:
        condition: service_healthy
    ports:
      - "4848:4848"
    environment:
      ZERO_UPSTREAM_DB: postgres://postgres:pass@upstream-db:5432/ditero_spike
      ZERO_CVR_DB: postgres://postgres:pass@upstream-db:5432/ditero_spike
      ZERO_CHANGE_DB: postgres://postgres:pass@upstream-db:5432/ditero_spike
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: spikeadmin
      # zero-cache calls back to the Elysia API running on the host:
      ZERO_QUERY_URL: http://host.docker.internal:3000/api/zero/query
      ZERO_MUTATE_URL: http://host.docker.internal:3000/api/zero/mutate
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
      # Symmetric JWT secret shared with the API for the spike (dev only):
      ZERO_AUTH_SECRET: spike-dev-secret-change-me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - spike-zero:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4848/keepalive || exit 1"]
      interval: 5s
      start_period: 120s
    profiles: ["sync"] # started explicitly: `docker compose --profile sync up zero-cache`

volumes:
  spike-pg:
  spike-zero:
