name: Bug Report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Ditero version / image tag
      placeholder: "e.g. 0.4.2, nightly-a1b2c3d, latest"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose (bundled Postgres)
        - Docker Compose (external Postgres)
        - Helm (Kubernetes)
        - Kubernetes (raw manifests)
        - Native app (desktop)
        - Native app (mobile)
        - From source
        - Other / custom
    validations:
      required: true

  - type: input
    id: postgres
    attributes:
      label: Postgres
      description: Version and where it runs (bundled, Supabase, self-hosted, etc.).
      placeholder: "e.g. 18, bundled compose"
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client
      description: Browser or native app + OS, if relevant.
      placeholder: "e.g. Firefox 140 on Linux, Android app on Pixel 8"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      render: text
