name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated tag to release (e.g. v0.0.1-alpha.1)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
      android-code: ${{ steps.prepare.outputs.android-code }}
      dockerhub: ${{ steps.prepare.outputs.dockerhub }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate tag and the exact release commit
        id: prepare
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
          DOCKERHUB_ENABLED: ${{ vars.DITERO_DOCKERHUB_ENABLED || 'true' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/release.py prepare

  native:
    needs: prepare
    uses: ./.github/workflows/native-release.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      android-version-code: ${{ fromJSON(needs.prepare.outputs.android-code) }}
    secrets:
      DITERO_ANDROID_KEYSTORE_BASE64: ${{ secrets.DITERO_ANDROID_KEYSTORE_BASE64 }}
      DITERO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DITERO_ANDROID_KEYSTORE_PASSWORD }}
      DITERO_ANDROID_KEY_ALIAS: ${{ secrets.DITERO_ANDROID_KEY_ALIAS }}
      DITERO_ANDROID_KEY_PASSWORD: ${{ secrets.DITERO_ANDROID_KEY_PASSWORD }}

  deployment:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: helm lint deploy/helm/ditero --strict
      - run: python3 scripts/release.py deployment --output release-deployment
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-deployment
          path: release-deployment/*
          if-no-files-found: error
          retention-days: 30

  # The Compose stack pins zero-cache to <tag>-zero, so a release that publishes
  # only the app image leaves the stack unrunnable without a checkout. Its base is
  # rocicorp/zero, not ${RUNTIME_IMAGE}, so it is variant-independent and runs once
  # rather than as a leg of the runtime matrix.
  docker-zero:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: prepare
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing via Sigstore OIDC
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Resolve commit sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.dockerhub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ needs.prepare.outputs.dockerhub == 'true' && 'docker.io/iuliandita/ditero' || '' }}
          # onlatest is load-bearing: without it the suffix skips the auto latest
          # tag and this job would publish the zero image as the app's :latest.
          flavor: |
            suffix=-zero,onlatest=true
            latest=${{ needs.prepare.outputs.prerelease != 'true' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.prerelease != 'true' }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.prerelease != 'true' }}

      - name: Smoke-test Zero runtime
        run: tests/container/zero.sh

      - name: Pre-push Zero image security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ditero-zero-smoke
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: "v0.74.0"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: zero-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DITERO_GIT_SHA=${{ steps.sha.outputs.sha }}
            DITERO_CHANNEL=${{ needs.prepare.outputs.prerelease == 'true' && 'alpha' || 'stable' }}
          cache-from: |
            type=gha,scope=ditero-zero
            type=gha
          cache-to: type=gha,scope=ditero-zero,mode=max

      - name: Zero image security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: "v0.74.0"

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign images (cosign keyless)
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKER_IMAGE: docker.io/iuliandita/ditero
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ needs.prepare.outputs.dockerhub }}
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          if [ "$DOCKERHUB" = true ]; then cosign sign --yes "${DOCKER_IMAGE}@${DIGEST}"; fi

      - name: Generate SBOM (container)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # By digest, not steps.meta.outputs.version: whether that output carries
          # the -zero suffix is undocumented, and getting it wrong would SBOM the
          # app image under the zero image's name.
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          artifact-name: sbom-zero.spdx.json
          output-file: sbom-zero.spdx.json

      # Attested to the registry only: the GitHub release is created by the docker
      # job, which runs in parallel, so there is nothing to upload to yet.
      - name: Attest SBOM (container) via cosign
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKER_IMAGE: docker.io/iuliandita/ditero
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ needs.prepare.outputs.dockerhub }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom-zero.spdx.json "${GHCR_IMAGE}@${DIGEST}"
          if [ "$DOCKERHUB" = true ]; then cosign attest --yes --type spdxjson --predicate sbom-zero.spdx.json "${DOCKER_IMAGE}@${DIGEST}"; fi

      - name: Collect Zero image evidence
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir image-evidence
          mv sbom-zero.spdx.json "image-evidence/ditero-${VERSION}-sbom-zero.spdx.json"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "image-evidence/ditero-${VERSION}-image-zero.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-zero
          path: image-evidence/*
          if-no-files-found: error
          retention-days: 30

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: prepare
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing via Sigstore OIDC
      attestations: write # actions/attest-build-provenance
    strategy:
      matrix:
        include:
          # alpine is primary: owns unsuffixed :latest/:vX.Y.Z + the release/SBOM steps.
          - variant: alpine
            runtime-image: "oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0"
            suffix: ""
            latest: "auto"
          - variant: debian
            runtime-image: "oven/bun:1.3.14-slim@sha256:d56a2534ffd262e92c12fd3249d3924d296d97086da773f821d7d0477435ea04"
            suffix: "-debian"
            latest: "false"
    steps:
      # Check out the released tag, not the trigger ref (matters on workflow_dispatch).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Resolve commit sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.dockerhub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ needs.prepare.outputs.dockerhub == 'true' && 'docker.io/iuliandita/ditero' || '' }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
            latest=${{ matrix.variant == 'alpine' && needs.prepare.outputs.prerelease != 'true' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.prerelease != 'true' }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.prerelease != 'true' }}

      - name: Smoke-test runtime variant
        env:
          RUNTIME_IMAGE: ${{ matrix.runtime-image }}
          VARIANT: ${{ matrix.variant }}
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          docker build -f deploy/docker/Dockerfile \
            --build-arg "RUNTIME_IMAGE=${RUNTIME_IMAGE}" \
            --build-arg "RUNTIME_VARIANT=${VARIANT}" \
            --build-arg "DITERO_GIT_SHA=${GIT_SHA}" \
            -t ditero-smoke .
          tests/container/smoke.sh ditero-smoke "$VARIANT" "$GIT_SHA"

      - name: Pre-push image security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ditero-smoke
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: "v0.74.0"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNTIME_IMAGE=${{ matrix.runtime-image }}
            RUNTIME_VARIANT=${{ matrix.variant }}
            DITERO_GIT_SHA=${{ steps.sha.outputs.sha }}
            DITERO_CHANNEL=${{ needs.prepare.outputs.prerelease == 'true' && 'alpha' || 'stable' }}
          cache-from: |
            type=gha,scope=ditero-app-${{ matrix.variant }}
            type=gha
          cache-to: type=gha,scope=ditero-app-${{ matrix.variant }},mode=max

      - name: Image security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: "v0.74.0"

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign images (cosign keyless)
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKER_IMAGE: docker.io/iuliandita/ditero
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ needs.prepare.outputs.dockerhub }}
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          if [ "$DOCKERHUB" = true ]; then cosign sign --yes "${DOCKER_IMAGE}@${DIGEST}"; fi

      - name: Generate SBOM (container)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          artifact-name: sbom-${{ matrix.variant }}.spdx.json
          output-file: sbom-container.spdx.json

      - name: Attest SBOM (container) via cosign
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKER_IMAGE: docker.io/iuliandita/ditero
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ needs.prepare.outputs.dockerhub }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom-container.spdx.json "${GHCR_IMAGE}@${DIGEST}"
          if [ "$DOCKERHUB" = true ]; then cosign attest --yes --type spdxjson --predicate sbom-container.spdx.json "${DOCKER_IMAGE}@${DIGEST}"; fi

      - name: Collect image evidence
        env:
          VARIANT: ${{ matrix.variant }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir image-evidence
          mv sbom-container.spdx.json "image-evidence/ditero-${VERSION}-sbom-${VARIANT}.spdx.json"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "image-evidence/ditero-${VERSION}-image-${VARIANT}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ matrix.variant }}
          path: image-evidence/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, native, deployment, docker, docker-zero]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-downloads
          merge-multiple: true
      - name: Verify the complete release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          DOCKERHUB_ENABLED: ${{ needs.prepare.outputs.dockerhub }}
        run: python3 scripts/release.py publish --output release-downloads
