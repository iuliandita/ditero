name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.12.13)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: javascript-typescript
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: |
          set -euo pipefail
          report=$(bun audit --json 2>/dev/null || true)
          echo "$report"
          count=$(printf '%s' "$report" | jq '[.vulnerabilities[]? | select(.severity == "high" or .severity == "critical")] | length')
          test "$count" -eq 0
      - name: Filesystem security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivy-version: "0.70.0"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:integration
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: tests/container/compose.sh
      - run: tests/container/zero.sh
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

  docker:
    runs-on: ubuntu-24.04
    needs: quality-gate
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write # cosign keyless signing via Sigstore OIDC
      attestations: write # actions/attest-build-provenance
    strategy:
      matrix:
        include:
          # alpine is primary: owns unsuffixed :latest/:vX.Y.Z + the release/SBOM steps.
          - variant: alpine
            runtime-image: "oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0"
            suffix: ""
            latest: "auto"
          - variant: debian
            runtime-image: "oven/bun:1.3.14-slim@sha256:d56a2534ffd262e92c12fd3249d3924d296d97086da773f821d7d0477435ea04"
            suffix: "-debian"
            latest: "false"
    steps:
      # Check out the released tag, not the trigger ref (matters on workflow_dispatch).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve commit sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or v1.2.3-rc.0"
            exit 1
          fi
          echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$INPUT_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/iuliandita/ditero
          flavor: |
            suffix=${{ matrix.suffix }}
            latest=${{ matrix.latest }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.value }}

      - name: Smoke-test runtime variant
        env:
          RUNTIME_IMAGE: ${{ matrix.runtime-image }}
          VARIANT: ${{ matrix.variant }}
        run: |
          docker build -f deploy/docker/Dockerfile \
            --build-arg "RUNTIME_IMAGE=${RUNTIME_IMAGE}" \
            --build-arg "RUNTIME_VARIANT=${VARIANT}" \
            -t ditero-smoke .
          tests/container/smoke.sh ditero-smoke "$VARIANT"

      - name: Pre-push image security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ditero-smoke
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivy-version: "0.70.0"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNTIME_IMAGE=${{ matrix.runtime-image }}
            RUNTIME_VARIANT=${{ matrix.variant }}
            DITERO_GIT_SHA=${{ steps.sha.outputs.sha }}
            DITERO_CHANNEL=${{ steps.tag.outputs.prerelease == 'true' && 'rc' || 'stable' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivy-version: "0.70.0"

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign images (cosign keyless)
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKER_IMAGE: docker.io/iuliandita/ditero
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          cosign sign --yes "${DOCKER_IMAGE}@${DIGEST}"

      - name: Generate SBOM (container)
        if: matrix.variant == 'alpine'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_REF }}
          artifact-name: sbom-container.spdx.json
          output-file: sbom-container.spdx.json

      - name: Attest SBOM (container) via cosign
        if: matrix.variant == 'alpine'
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKER_IMAGE: docker.io/iuliandita/ditero
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom-container.spdx.json "${GHCR_IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom-container.spdx.json "${DOCKER_IMAGE}@${DIGEST}"

      - name: Ensure release exists and upload SBOM
        if: matrix.variant == 'alpine'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping create"
          else
            release_args=(gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then
              release_args+=(--prerelease)
            fi
            "${release_args[@]}"
          fi
          gh release upload "$TAG" sbom-container.spdx.json --clobber
