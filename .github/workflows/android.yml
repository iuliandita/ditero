name: Android

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Select Java 21 and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${JAVA_HOME_21_X64:?Runner Java 21 is required}"
          : "${ANDROID_HOME:?Runner Android SDK is required}"
          test -x "$JAVA_HOME_21_X64/bin/java"
          "$JAVA_HOME_21_X64/bin/java" -XshowSettings:properties -version 2>&1 \
            | grep -E 'java.specification.version = 21$' > /dev/null
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$sdkmanager" --install "platform-tools" "platforms;android-36" \
            "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install Android dependencies
        working-directory: apps/android
        run: bun install --frozen-lockfile
      - name: Compile messages
        run: bun run i18n:compile
      - name: Check Android TypeScript
        run: bunx tsc --noEmit --project apps/android/tsconfig.json
      - name: Test native bridge lifecycle
        run: bunx vitest run apps/android/src/bridge.test.ts
      - name: Build bundled UI
        working-directory: apps/android
        run: bun run build
      - name: Sync Capacitor Android project
        working-directory: apps/android
        run: bun run sync
      - name: Assemble independent debug APK
        working-directory: apps/android/android
        run: ./gradlew --no-daemon testIndependentDebugUnitTest assembleIndependentDebug
      - name: Check Google source without private configuration
        working-directory: apps/android/android
        run: ./gradlew --no-daemon testGoogleDebugUnitTest
      - name: Refuse Google packaging without private configuration
        working-directory: apps/android/android
        shell: bash
        run: |
          set -euo pipefail
          refusal="$RUNNER_TEMP/google-package-refusal.log"
          if ./gradlew --no-daemon assembleGoogleDebug > "$refusal" 2>&1; then
            echo "Google packaging unexpectedly succeeded without private configuration"
            exit 1
          fi
          grep -F "Google Android packaging requires private google-services.json and src/google/assets/native-relay.json with a trusted relay origin and receipt keys" "$refusal"
      - name: Upload test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-independent-debug-apk-${{ github.sha }}
          path: apps/android/android/app/build/outputs/apk/independent/debug/app-independent-debug.apk
          if-no-files-found: error
          retention-days: 7
