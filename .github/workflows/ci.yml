name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - if: ${{ !cancelled() }}
        run: bun run i18n:compile && bun run i18n:validate
      - if: ${{ !cancelled() }}
        run: bun run typecheck
      - if: ${{ !cancelled() }}
        run: bun run test

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run i18n:compile
      - run: bun run test:integration

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Firefox and WebKit retain the cross-engine crypto gate.
      - run: bunx playwright install --with-deps chromium firefox webkit
      - name: Isolated browser tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/reports/isolated.json
        run: >-
          bun run test:e2e --project=chromium --project=firefox --project=webkit
          --workers=2 --shard="$E2E_SHARD/3" --fail-on-flaky-tests
          --reporter=list,json --output=test-results/isolated
      # Each invocation tears down its stack. Always collect both phases unless
      # cancelled; separate outputs preserve the first phase's failure evidence.
      - name: Serial browser tests
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/reports/serial.json
        run: >-
          bun run test:e2e --project=chromium-serial --workers=1
          --shard="$E2E_SHARD/3" --fail-on-flaky-tests
          --reporter=list,json --output=test-results/serial
      - name: Upload browser reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Preserve source builds and run the container smokes sequentially.
      - run: tests/container/compose.sh
      - run: tests/container/zero.sh
      - run: tests/container/zero-shard.sh

  verify:
    if: ${{ always() }}
    needs: [checks, integration, e2e, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          jq --exit-status
          'length == 4 and all(.[]; .result == "success")'
          <<< "$JOB_RESULTS"
