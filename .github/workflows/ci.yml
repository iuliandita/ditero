name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run i18n:compile && bun run i18n:validate
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:integration
      # firefox and webkit carry one spec only (crypto-vectors.spec.ts, the
      # three-engine crypto vector gate); every other spec stays on chromium.
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:e2e
      - run: tests/container/compose.sh
      - run: tests/container/zero.sh
      - run: tests/container/zero-shard.sh
