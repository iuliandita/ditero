name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation impact with base-owned policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # One-time reviewed bootstrap base; subsequent missing policies fail.
          DOCS_IMPACT_BOOTSTRAP_BASE: a57012691dc362ea264b45f20c626ac37dd83996
        run: |
          python3 -I - <<'PYTHON'
          import hashlib, json, os, pathlib, re, subprocess, sys, tempfile
          event_path = pathlib.Path(os.environ['GITHUB_EVENT_PATH'])
          if event_path.stat().st_size > 2097152:
              raise SystemExit('Event exceeds limit')
          event = json.loads(event_path.read_text())
          base = event['pull_request']['base']['sha'] if 'pull_request' in event else event['before']
          if not isinstance(base, str) or not re.fullmatch('[0-9a-f]{40}', base):
              raise SystemExit('Invalid immutable base')
          def git(*args):
              return subprocess.run(['git', '--no-pager', *args], capture_output=True, timeout=30)
          resolved = git('cat-file', '-t', base)
          if resolved.returncode or resolved.stdout.strip() != b'commit':
              raise SystemExit('Base commit unavailable; do not substitute checkout policy')
          listing = git('ls-tree', base, '--', 'scripts/docs-impact.py')
          if listing.returncode or (listing.stdout and not listing.stdout.startswith((b'100644 blob ', b'100755 blob '))):
              raise SystemExit('Base policy must be a regular Git blob')
          policy = git('show', base + ':scripts/docs-impact.py')
          if policy.returncode:
              listing = git('ls-tree', base, '--', 'scripts/docs-impact.py')
              if listing.returncode or listing.stdout or base != os.environ['DOCS_IMPACT_BOOTSTRAP_BASE']:
                  raise SystemExit('Base checker missing; explicit one-time bootstrap pin required')
              print('BOOTSTRAP: executing proposed checker; independent source review required', flush=True)
              proposed = pathlib.Path('scripts/docs-impact.py')
              if proposed.is_symlink() or not proposed.is_file():
                  raise SystemExit('Bootstrap policy must be a regular file')
              source = proposed.read_bytes()
          else:
              source = policy.stdout
          if len(source) > 2097152:
              raise SystemExit('Policy exceeds limit')
          print('Checker SHA256: ' + hashlib.sha256(source).hexdigest(), flush=True)
          with tempfile.TemporaryDirectory(prefix='docs-impact-') as directory:
              checker = pathlib.Path(directory) / 'check.py'
              checker.write_bytes(source)
              subprocess.run([sys.executable, '-I', str(checker), '--event', str(event_path)], check=True, timeout=180)
          PYTHON
      - name: Test proposed documentation guard offline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I scripts/test-docs-impact.py
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - if: ${{ !cancelled() }}
        run: bun run i18n:compile && bun run i18n:validate
      - if: ${{ !cancelled() }}
        run: bun run typecheck
      - if: ${{ !cancelled() }}
        run: bun run test

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run i18n:compile
      - run: bun run test:integration

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_SHARD: ${{ matrix.shard }}
      E2E_BROWSER_CONTAINER: "1"
      E2E_BROWSER_MODE: "compiled"
      DITERO_E2E_DB_PORT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Build compiled browser fixture once
        run: bun run tests/e2e/compiled-web.ts build
      # Firefox and WebKit retain the cross-engine crypto gate.
      - name: Browser image
        id: browser-image
        timeout-minutes: 5
        run: >-
          docker compose --project-name ditero-e2e
          --file tests/e2e/docker-compose.yml --profile browser pull browser
      - name: Isolated browser tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/reports/isolated.json
        run: >-
          bun run test:e2e --project=chromium --project=firefox --project=webkit
          --workers=2 --shard="$E2E_SHARD/3" --fail-on-flaky-tests
          --reporter=list,json --output=test-results/isolated
      # Each invocation tears down its stack. Once setup succeeds, collect both
      # phases unless cancelled; separate outputs preserve failure evidence.
      - name: Serial browser tests
        if: ${{ !cancelled() && steps.browser-image.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/reports/serial.json
        run: |
          case "$E2E_SHARD" in
            1) serial_specs=(tests/e2e/ack-live.spec.ts tests/e2e/auth-hardening.spec.ts tests/e2e/channels.spec.ts tests/e2e/dashboards.spec.ts) ;;
            2) serial_specs=(tests/e2e/domain.spec.ts tests/e2e/e2e-invite-fragment.spec.ts tests/e2e/navigation.spec.ts) ;;
            3) serial_specs=(tests/e2e/notifications.spec.ts tests/e2e/sharing.spec.ts tests/e2e/spine.spec.ts) ;;
            *) echo "Unknown E2E_SHARD: $E2E_SHARD" >&2; exit 1 ;;
          esac
          bun run test:e2e "${serial_specs[@]}" --project=chromium-serial --workers=1 \
            --fail-on-flaky-tests --reporter=list,json --output=test-results/serial
      - name: Upload browser reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Remove only owned compiled browser output
        if: ${{ always() && env.E2E_COMPILED_WEB_DIR != '' }}
        run: bun run tests/e2e/compiled-web.ts cleanup

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Preserve source builds and run the container smokes sequentially.
      - run: tests/container/compose.sh
      - run: tests/container/zero.sh
      - run: tests/container/zero-shard.sh
      - run: bun run tests/cnpg/bootstrap.ts
      - run: bun run tests/container/postgres-init-secrets.ts

  push-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run i18n:compile
      - run: bun run push-relay:typecheck
      - run: bun run push-relay:test
      - run: bun run push-relay:integration
      - run: bun run native-relay-instance:integration
      - run: docker build --file apps/push-relay/Dockerfile --tag ditero-push-relay:check .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ditero-push-relay:check
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: "v0.70.0"
      - run: bun run push-relay:integration
        env:
          RELAY_TEST_IMAGE: ditero-push-relay:check
          RELAY_TEST_SMOKE_ONLY: "1"

  verify:
    if: ${{ always() }}
    needs: [checks, integration, e2e, containers, push-relay]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          jq --exit-status
          'length == 5 and all(.[]; .result == "success")'
          <<< "$JOB_RESULTS"
