name: Published AIO runtime qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: published-aio-runtime-qualification
  cancel-in-progress: false

jobs:
  native-runtime:
    name: Native ${{ matrix.arch }} runtime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out verification tooling
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: tooling
          persist-credentials: false
      - name: Check out immutable candidate tests
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: 792ecf49ea1500f360a965a656bec5e43cb93303
          path: candidate
          persist-credentials: false
      - name: Download existing immutable publication
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '11595876327'
          run-id: '37883668165'
          github-token: ${{ github.token }}
          repository: iuliandita/ditero
          skip-decompress: true
          digest-mismatch: error
          path: ${{ runner.temp }}/aio-artifact
      - name: Qualify published image and packaged wrapper
        env:
          ARCH: ${{ matrix.arch }}
          ARCHIVE_DIR: ${{ runner.temp }}/aio-artifact
          CANDIDATE_SOURCE: ${{ github.workspace }}/candidate
          RECEIPT_DIR: ${{ runner.temp }}/aio-receipt
        run: >-
          python3 -I tooling/scripts/qualify-published-aio.py
          --archive-dir "$ARCHIVE_DIR" --source "$CANDIDATE_SOURCE"
          --arch "$ARCH" --output "$RECEIPT_DIR"
      - name: Retain sanitized qualification receipt
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-aio-runtime-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aio-receipt/receipt.json
          if-no-files-found: warn
          retention-days: 30
