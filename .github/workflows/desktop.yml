name: Desktop development installers

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            label: linux-x64-unsigned
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - runner: windows-2025
            platform: windows
            label: windows-x64-unsigned
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: windows-11-arm
            platform: windows-arm64
            label: windows-arm64-unsigned
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15
            platform: macos
            label: macos-arm64-adhoc
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            platform: macos-x64
            label: macos-x64-adhoc
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      DESKTOP_TARGET: ${{ matrix.target }}
      DESKTOP_BUNDLES: ${{ matrix.bundles }}
      DESKTOP_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev \
            libarchive-tools patchelf libfuse2t64 appstream xvfb x11-utils
      - name: Select Rust toolchain
        run: |
          set -euo pipefail
          if [[ "$DESKTOP_PLATFORM" == windows* ]]; then
            rustup set default-host "$DESKTOP_TARGET"
          fi
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
          rustup target add "$DESKTOP_TARGET"
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: native-${{ matrix.target }}-1.98.1
      - name: Validate AppStream metadata
        if: runner.os == 'Linux'
        run: appstreamcli validate --no-net apps/desktop/linux/io.ditero.desktop.metainfo.xml
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Compile shared messages
        run: bun run i18n:compile
      - name: Check desktop TypeScript
        run: bunx tsc --noEmit --project apps/desktop/tsconfig.json
      - name: Test desktop bridge lifecycle
        run: bunx vitest run apps/desktop/src/transport.test.ts
      - name: Build bundled UI
        working-directory: apps/desktop
        run: bun run build
      - name: Check native formatting and lifecycle
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked --target "$DESKTOP_TARGET"
      - name: Build development installer
        id: package
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          (
            umask 077
            mkdir -p "$RUNNER_TEMP/desktop-packaging"
            : > "$RUNNER_TEMP/desktop-packaging/packaging.log"
          )
          set +e
          bun run tauri build --verbose --debug --no-binary-patching --target "$DESKTOP_TARGET" \
            --bundles "$DESKTOP_BUNDLES" -- --locked 2>&1 |
            tee "$RUNNER_TEMP/desktop-packaging/packaging.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${statuses[0]}" -ne 0 ]; then
            exit "${statuses[0]}"
          fi
          exit "${statuses[1]}"
      - name: Upload failed packaging diagnostics
        if: ${{ always() && steps.package.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.label }}-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-packaging/packaging.log
            apps/desktop/src-tauri/target/${{ matrix.target }}/debug/bundle/dmg/bundle_dmg.sh
          if-no-files-found: warn
          retention-days: 7
      - name: Smoke-test Linux installers
        if: runner.os == 'Linux'
        run: bash scripts/desktop-smoke.sh linux "$DESKTOP_TARGET" debug
      - name: Smoke-test macOS disk image
        if: runner.os == 'macOS'
        run: bash scripts/desktop-smoke.sh macos "$DESKTOP_TARGET" debug
      - name: Smoke-test Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/desktop-smoke.ps1 -Target $env:DESKTOP_TARGET -Profile debug
      - name: Upload installer smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-${{ matrix.label }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Collect development installers and checksums
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')
          python3 scripts/native-artifacts.py --platform "$DESKTOP_PLATFORM" \
            --version "$version" --profile debug --output desktop-packages
          python3 - <<'PYTHON'
          import hashlib, pathlib
          output = pathlib.Path('desktop-packages')
          lines = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(output.iterdir())]
          (output / 'SHA256SUMS.txt').write_text(''.join(lines))
          PYTHON
      - name: Upload development installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.label }}-development-${{ github.sha }}
          path: desktop-packages/*
          if-no-files-found: error
          retention-days: 7
