name: Release packaging checks

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install pinned kubectl for local rendering
        run: |
          mkdir -p "$RUNNER_TEMP/kubectl"
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/kubectl/kubectl"
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl.sha256 -o "$RUNNER_TEMP/kubectl/kubectl.sha256"
          cd "$RUNNER_TEMP/kubectl"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod 0755 kubectl
          echo "$RUNNER_TEMP/kubectl" >> "$GITHUB_PATH"
      - name: Validate release helpers
        run: |
          python3 scripts/test-release.py
          python3 scripts/release.py check
          python3 -I scripts/docs-impact.py --static
          python3 -I scripts/test-docs-release.py
      - name: Validate Helm, Kustomize and deployment archives
        run: |
          helm lint deploy/helm/ditero --strict
          helm template ditero deploy/helm/ditero > "$RUNNER_TEMP/ditero-default.yaml"
          bun run tests/helm/render.ts
          bun run tests/kustomize/render.ts
          bun run tests/cnpg/render.ts
          python3 scripts/release.py deployment --output "$RUNNER_TEMP/deployment"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-packages-${{ github.sha }}
          path: ${{ runner.temp }}/deployment/*
          if-no-files-found: error
          retention-days: 30

  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
        env:
          POSTGRES_DB: ditero_clients
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
        ports: [5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d ditero_clients"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      BETTER_AUTH_SECRET: integration-only-better-auth-secret
      BETTER_AUTH_URL: http://localhost:3000
      DITERO_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build:clients
      - name: Validate bundle identity, checksums and third-party notices
        run: python3 scripts/release.py clients --output out/clients
      - name: Install the minimum supported Bun
        run: |
          minimum="$(sed -n 's/.*MINIMUM_BUN = "\([0-9.]*\)";.*/\1/p' src/clients/build-info.ts)"
          test -n "$minimum"
          mkdir "$RUNNER_TEMP/minimum-bun"
          (cd "$RUNNER_TEMP/minimum-bun" && printf '{"private":true}\n' > package.json && bun add "bun@$minimum")
          echo "CLIENT_BUN_MINIMUM=$RUNNER_TEMP/minimum-bun/node_modules/.bin/bun" >> "$GITHUB_ENV"
      - name: Qualify the extracted bundles on current and minimum Bun
        env:
          DATABASE_URL: postgres://postgres:pass@localhost:${{ job.services.postgres.ports['5432'] }}/ditero_clients
        run: |
          bun run db:migrate
          CLIENT_ARCHIVE="$(find out/clients -maxdepth 1 -name '*-clients.tar.gz' -print)"
          export CLIENT_ARCHIVE
          bunx vitest run tests/integration/terminal-bundles.test.ts
          CLIENT_BUN="$CLIENT_BUN_MINIMUM" bunx vitest run tests/integration/terminal-bundles.test.ts
