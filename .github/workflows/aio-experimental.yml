name: Experimental AIO bundle
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full checked develop commit SHA; dispatch ref must resolve to it
        required: true
        type: string
  pull_request:
    branches: [develop, main]
    paths:
      - .github/workflows/aio-experimental.yml
      - scripts/package-aio.py
      - scripts/test-package-aio.py
      - deploy/docker/aio/**
permissions:
  contents: read
concurrency:
  group: aio-experimental-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - run: python3 -I scripts/test-package-aio.py
      - run: node tests/container/aio-bundle.mjs
  prepare:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require checked source and latest required push checks
        id: gate
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I scripts/package-aio.py check-source --sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" --repo "$REPO"
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
  platform:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      CANDIDATE: aio-experimental-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      ARCH: ${{ matrix.arch }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      GHCR_IMAGE: ghcr.io/iuliandita/ditero
      DOCKER_IMAGE: docker.io/iuliandita/ditero
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build one platform exactly once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile.all-in-one
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ditero-aio:experimental
          build-args: |
            ZERO_RUNTIME_IMAGE=ghcr.io/iuliandita/ditero@sha256:41de0920d3cc704aa38983e25f358025684210b63405258ebc989eeefe6ac24d
            DITERO_GIT_SHA=${{ needs.prepare.outputs.sha }}
            DITERO_CHANNEL=aio-experimental
      - name: Strict scan of this platform before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ditero-aio:experimental
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.74.0
      - name: Recheck current required runs before registry writes
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/package-aio.py check-source --sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" --repo "$REPO"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish scanned bytes to both registries
        id: push
        run: |
          test "$(docker image inspect ditero-aio:experimental --format '{{.Architecture}}')" = "$ARCH"
          test "$(docker image inspect ditero-aio:experimental --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          for image in "$GHCR_IMAGE" "$DOCKER_IMAGE"; do
            docker tag ditero-aio:experimental "$image:$CANDIDATE-$ARCH"
            docker push "$image:$CANDIDATE-$ARCH"
          done
          first=$(docker buildx imagetools inspect "$GHCR_IMAGE:$CANDIDATE-$ARCH" --format '{{.Manifest.Digest}}')
          second=$(docker buildx imagetools inspect "$DOCKER_IMAGE:$CANDIDATE-$ARCH" --format '{{.Manifest.Digest}}')
          test "$first" = "$second"
          printf 'digest=%s\n' "$first" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/iuliandita/ditero
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/iuliandita/ditero@${{ steps.push.outputs.digest }}
          artifact-name: sbom-aio-${{ matrix.arch }}.spdx.json
          output-file: sbom-${{ matrix.arch }}.spdx.json
      - name: Sign and attest exact platform digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for image in "$GHCR_IMAGE" "$DOCKER_IMAGE"; do
            cosign sign --yes "$image@$DIGEST"
            cosign attest --yes --type spdxjson --predicate "sbom-$ARCH.spdx.json" "$image@$DIGEST"
          done
          python3 - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          arch=os.environ['ARCH'];name=f'sbom-{arch}.spdx.json'
          row={'sourceSHA':os.environ['SOURCE_SHA'],'platform':'linux/'+arch,'digest':os.environ['DIGEST'],'registriesMatch':True,'scanPassed':True,'signed':True,'provenanceAttested':True,'sbom':name,'sbomSHA256':hashlib.sha256(Path(name).read_bytes()).hexdigest()}
          Path(f'platform-{arch}.json').write_text(json.dumps(row))
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aio-platform-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: |
            platform-${{ matrix.arch }}.json
            sbom-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 30
  bundle:
    needs: [prepare, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      CANDIDATE: aio-experimental-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      GHCR_IMAGE: ghcr.io/iuliandita/ditero
      DOCKER_IMAGE: docker.io/iuliandita/ditero
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aio-platform-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: evidence
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Recheck current required runs before registry writes
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/package-aio.py check-source --sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" --repo "$REPO"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Assemble identical multiarch indexes from scanned platform bytes
        id: index
        run: |
          amd64=$(python3 -c 'import json;print(json.load(open("evidence/platform-amd64.json"))["digest"])')
          arm64=$(python3 -c 'import json;print(json.load(open("evidence/platform-arm64.json"))["digest"])')
          for image in "$GHCR_IMAGE" "$DOCKER_IMAGE"; do
            docker buildx imagetools create --tag "$image:$CANDIDATE" "$GHCR_IMAGE@$amd64" "$GHCR_IMAGE@$arm64"
          done
          first=$(docker buildx imagetools inspect "$GHCR_IMAGE:$CANDIDATE" --format '{{.Manifest.Digest}}')
          second=$(docker buildx imagetools inspect "$DOCKER_IMAGE:$CANDIDATE" --format '{{.Manifest.Digest}}')
          test "$first" = "$second"
          printf 'digest=%s\n' "$first" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/iuliandita/ditero
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Sign index and package checkout-free wrapper
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
          cosign sign --yes "$DOCKER_IMAGE@$DIGEST"
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          platforms={arch:json.loads(Path(f'evidence/platform-{arch}.json').read_text()) for arch in ('amd64','arm64')}
          data={'sourceSHA':os.environ['SOURCE_SHA'],'candidate':os.environ['CANDIDATE'],'workflowRef':os.environ['WORKFLOW_REF'],'workflowRunURL':'https://github.com/iuliandita/ditero/actions/runs/'+os.environ['GITHUB_RUN_ID'],'repositories':[os.environ['GHCR_IMAGE'],os.environ['DOCKER_IMAGE']],'indexDigest':os.environ['DIGEST'],'indexRegistriesMatch':True,'indexSigned':True,'indexProvenanceAttested':True,'platforms':platforms}
          Path('evidence/inventory.json').write_text(json.dumps(data))
          PYCODE
          python3 -I scripts/package-aio.py package --sha "$SOURCE_SHA" --inventory evidence/inventory.json --evidence evidence --output bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aio-experimental-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/*
          if-no-files-found: error
          retention-days: 30
