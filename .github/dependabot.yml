# No `npm` ecosystem here on purpose. Dependabot does not understand Bun's
# `bun.lock`, so it rewrites package.json and leaves the lockfile stale; every
# such PR then dies on `bun install --frozen-lockfile` in ~10s and can never be
# merged. Its version reasoning is wrong without the lock too -- the queue
# proposed several downgrades. npm currency comes from periodic `bun update`
# sweeps instead, which is also the only mechanism that reaches the transitive
# dependencies the security gate actually flags. Dependabot SECURITY ALERTS are
# configured separately from update PRs and are unaffected by this file.
#
# Both remaining ecosystems target develop: deps land there and soak on
# :nightly, and main only ever receives release merges.
version: 2
updates:
  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: develop
    schedule:
      interval: daily
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
