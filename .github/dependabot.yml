version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Deps land on develop and soak on :nightly; main only receives release merges.
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      production:
        patterns:
          - "@rocicorp/zero"
          - "drizzle-*"
          - "pg"
          - "elysia"
          - "@elysiajs/*"
          - "better-auth"
          - "zod"
          - "croner"
          - "jose"
          - "rrule"
      dev-tools:
        patterns:
          - "typescript"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@biomejs/*"
          - "drizzle-kit"
          - "drizzle-zero"
          - "@vitejs/*"
          - "@types/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "@tanstack/*"
      testing:
        patterns:
          - "@testing-library/*"
          - "@playwright/*"
          - "@axe-core/*"
      frontend:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "lucide-react"
          - "sonner"
          - "clsx"
          - "class-variance-authority"
          - "tailwind-merge"
      native:
        patterns:
          - "@capacitor/*"
          - "@tauri-apps/*"
      misc:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: develop
    schedule:
      interval: daily
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
