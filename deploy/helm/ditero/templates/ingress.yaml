{{- range $component := list "app" "zero" }}
{{- $ingress := (index $.Values $component).ingress }}
{{- if $ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ditero.fullname" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ditero.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $ingress.host | quote }}
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ required (printf "%s.ingress.host is required when ingress is enabled" $component) $ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ditero.fullname" $ }}-{{ $component }}
                port:
                  name: http
{{- end }}
{{- end }}
