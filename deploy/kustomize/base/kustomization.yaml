apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ditero
resources:
- ditero-app-deployment.yaml
- ditero-app-persistentvolumeclaim.yaml
- ditero-app-service.yaml
- ditero-zero-deployment.yaml
- ditero-zero-persistentvolumeclaim.yaml
- ditero-zero-service.yaml
- namespace.yaml
configMapGenerator:
- name: ditero-app-config
  envs:
  - app.env
replacements:
- source:
    kind: Deployment
    name: ditero-app
    fieldPath: spec.template.spec.containers.[name=app].image
  targets:
  - select:
      kind: Deployment
      name: ditero-app
    fieldPaths:
    - spec.template.spec.containers.[name=app].env.[name=DITERO_REPLICA_ID].value
  - select:
      kind: Deployment
      name: ditero-zero
    fieldPaths:
    - spec.template.spec.initContainers.[name=wait-for-app].env.[name=APP_REVISION].value
configurations:
- name-reference.yaml
