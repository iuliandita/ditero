apiVersion: apps/v1
kind: Deployment
metadata:
  name: ditero-app
  namespace: ditero
  labels:
    app.kubernetes.io/name: ditero
    app.kubernetes.io/instance: ditero
    app.kubernetes.io/version: 0.0.1-alpha.12
    app.kubernetes.io/part-of: ditero
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: ditero
      app.kubernetes.io/name: ditero
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ditero
        app.kubernetes.io/instance: ditero
        app.kubernetes.io/version: 0.0.1-alpha.12
        app.kubernetes.io/part-of: ditero
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ghcr.io/iuliandita/ditero:0.0.1-alpha.12
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: HOME
          value: /tmp
        - name: NODE_ENV
          value: production
        - name: API_PORT
          value: '3000'
        - name: SERVE_STATIC_DIR
          value: /app/dist
        - name: DITERO_ATTACHMENT_STORAGE_DRIVER
          value: filesystem
        - name: DITERO_ATTACHMENT_FS_PATH
          value: /data/attachments
        - name: DATABASE_URL_FILE
          value: /run/secrets/ditero/DATABASE_URL
        - name: DATABASE_MIGRATION_URL_FILE
          value: /run/secrets/ditero/DATABASE_MIGRATION_URL
        - name: BETTER_AUTH_SECRET_FILE
          value: /run/secrets/ditero/BETTER_AUTH_SECRET
        - name: DITERO_ENCRYPTION_KEY_FILE
          value: /run/secrets/ditero/DITERO_ENCRYPTION_KEY
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
        volumeMounts:
        - name: data
          mountPath: /data/attachments
        - name: secrets
          mountPath: /run/secrets/ditero
          readOnly: true
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: ditero-app-config
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ditero-app
      - name: secrets
        secret:
          secretName: ditero-secrets
          defaultMode: 288
          items:
          - key: DATABASE_URL
            path: DATABASE_URL
          - key: DATABASE_MIGRATION_URL
            path: DATABASE_MIGRATION_URL
          - key: BETTER_AUTH_SECRET
            path: BETTER_AUTH_SECRET
          - key: DITERO_ENCRYPTION_KEY
            path: DITERO_ENCRYPTION_KEY
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
