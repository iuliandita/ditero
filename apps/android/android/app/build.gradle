apply plugin: 'com.android.application'

def releaseSigning = [
    storeFile: System.getenv('DITERO_ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('DITERO_ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('DITERO_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('DITERO_ANDROID_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isEmpty() }
if (releaseSigning.values().any { it != null } && !hasReleaseSigning) {
    throw new GradleException('Android release signing requires all four DITERO_ANDROID_KEYSTORE_PATH, DITERO_ANDROID_KEYSTORE_PASSWORD, DITERO_ANDROID_KEY_ALIAS and DITERO_ANDROID_KEY_PASSWORD environment variables')
}
if (hasReleaseSigning && !file(releaseSigning.storeFile).isFile()) {
    throw new GradleException('Android release keystore is unavailable')
}

android {
    namespace = "io.ditero.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.ditero.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "pushProvider"
    productFlavors {
        independent { dimension "pushProvider" }
        google { dimension "pushProvider" }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Inspect the resolved graph so abbreviated, aggregate and direct packaging requests
// cannot bypass the variant or signing boundaries, including up-to-date outputs.
gradle.taskGraph.whenReady { graph ->
    def appTasks = graph.allTasks.findAll { it.project == project }
    if (appTasks.any { it.name.contains('Google') }) {
        if (!file('src/google/google-services.json').isFile() && !file('google-services.json').isFile()) {
            throw new GradleException('Google Android builds require private google-services.json in app/src/google/ or app/; Google push provider integration is not implemented')
        }
        throw new GradleException('Google Android builds are unavailable: Google push provider integration is not implemented; configuration alone cannot enable Google delivery')
    }
    if (appTasks.any { it.name ==~ /(?:assemble|bundle|package).*Release(?:Bundle|UniversalApk)?/ } && !hasReleaseSigning) {
        throw new GradleException('Android release packaging requires an explicitly configured release keystore; use assembleIndependentDebug for development')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.squareup.okhttp3:okhttp:5.4.0"
    implementation "org.unifiedpush.android:connector:3.3.5"
    implementation "androidx.work:work-runtime:2.12.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
