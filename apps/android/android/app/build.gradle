apply plugin: 'com.android.application'

def googleServices = file('src/google/google-services.json').isFile() || file('google-services.json').isFile()
if (googleServices) apply plugin: 'com.google.gms.google-services'
def relayConfiguration = file('src/google/assets/native-relay.json')

def releaseSigning = [
    storeFile: System.getenv('DITERO_ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('DITERO_ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('DITERO_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('DITERO_ANDROID_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isEmpty() }
if (releaseSigning.values().any { it != null } && !hasReleaseSigning) {
    throw new GradleException('Android release signing requires all four DITERO_ANDROID_KEYSTORE_PATH, DITERO_ANDROID_KEYSTORE_PASSWORD, DITERO_ANDROID_KEY_ALIAS and DITERO_ANDROID_KEY_PASSWORD environment variables')
}
if (hasReleaseSigning && !file(releaseSigning.storeFile).isFile()) {
    throw new GradleException('Android release keystore is unavailable')
}

android {
    namespace = "io.ditero.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.ditero.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions { coreLibraryDesugaringEnabled true }
    flavorDimensions "pushProvider"
    productFlavors {
        independent { dimension "pushProvider" }
        google { dimension "pushProvider" }
    }
    sourceSets {
        googleDebug {}
        googleRelease {}
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Inspect the resolved graph so abbreviated, aggregate and direct packaging requests
// cannot bypass the variant or signing boundaries, including up-to-date outputs.
gradle.taskGraph.whenReady { graph ->
    def appTasks = graph.allTasks.findAll { it.project == project }
    def packagesGoogle = appTasks.any { it.name ==~ /(?:assemble|bundle|package)Google(?:Debug|Release)(?:Bundle|UniversalApk|AndroidTest)?/ }
    if (packagesGoogle) {
        if (!googleServices || !relayConfiguration.isFile()) {
            throw new GradleException('Google Android packaging requires private google-services.json and src/google/assets/native-relay.json with a trusted relay origin and receipt keys')
        }
        try {
            def config = new groovy.json.JsonSlurper().parse(relayConfiguration)
            def origin = new URI(config.relayOrigin as String)
            if (config.keySet() != ['relayOrigin', 'receiptKeys'] as Set || origin.scheme != 'https' || origin.host == null
                    || origin.userInfo != null || origin.query != null || origin.fragment != null || origin.path != ''
                    || origin.port == 0 || origin.port > 65535 || origin.port == 443 || origin.toASCIIString() != config.relayOrigin
                    || origin.host != origin.host.toLowerCase(Locale.ROOT)
                    || !(config.receiptKeys instanceof Map) || config.receiptKeys.isEmpty() || config.receiptKeys.size() > 8
                    || config.receiptKeys.any { kid, key -> !(kid ==~ /[A-Za-z0-9_-]{1,128}/) || !(key instanceof Map)
                        || key.keySet() != ['kty', 'crv', 'x', 'y'] as Set || key.kty != 'EC' || key.crv != 'P-256'
                        || !(key.x ==~ /[A-Za-z0-9_-]{43}/) || !(key.y ==~ /[A-Za-z0-9_-]{43}/) }) {
                throw new IllegalArgumentException()
            }
        } catch (Exception e) {
            throw new GradleException('Google Android trusted relay configuration is invalid')
        }
    }
    if (appTasks.any { it.name ==~ /(?:assemble|bundle|package).*Release(?:Bundle|UniversalApk)?/ } && !hasReleaseSigning) {
        throw new GradleException('Android release packaging requires an explicitly configured release keystore; use assembleIndependentDebug for development')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations {
    googleDebugImplementation {}
    googleReleaseImplementation {}
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.squareup.okhttp3:okhttp:5.4.0"
    googleImplementation platform('com.google.firebase:firebase-bom:34.19.0')
    googleImplementation 'com.google.firebase:firebase-messaging:25.1.3'
    googleImplementation 'com.google.firebase:firebase-installations'
    googleImplementation 'com.google.firebase:firebase-appcheck'
    googleDebugImplementation 'com.google.firebase:firebase-appcheck-debug:19.4.1'
    googleReleaseImplementation 'com.google.firebase:firebase-appcheck-playintegrity:19.4.1'
    implementation "org.unifiedpush.android:connector:3.3.5"
    implementation "androidx.work:work-runtime:2.12.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The independent flavor never consumes Google configuration or generated resources.
tasks.configureEach { task ->
    if (task.name.startsWith('processIndependent') && task.name.endsWith('GoogleServices')) task.enabled = false
}
