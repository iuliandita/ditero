[package]
name = "ditero-desktop"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "native-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
keyring-core = "=1.0.0"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
regex = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"
