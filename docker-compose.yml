# Dev stack: Postgres (logical replication), zero-cache, and MinIO.
services:
  upstream-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ditero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    command: postgres -c wal_level=logical
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ditero-pg:/var/lib/postgresql

  zero-cache:
    image: rocicorp/zero:1.9.0
    depends_on:
      upstream-db:
        condition: service_healthy
    ports:
      - "4848:4848"
    environment:
      ZERO_UPSTREAM_DB: postgres://postgres:pass@upstream-db:5432/ditero
      ZERO_CVR_DB: postgres://postgres:pass@upstream-db:5432/ditero
      ZERO_CHANGE_DB: postgres://postgres:pass@upstream-db:5432/ditero
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: devadmin
      # zero-cache calls back to the Elysia API running on the host:
      ZERO_QUERY_URL: http://host.docker.internal:3000/api/zero/query
      ZERO_MUTATE_URL: http://host.docker.internal:3000/api/zero/mutate
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ditero-zero:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4848/keepalive || exit 1"]
      interval: 5s
      start_period: 120s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ditero-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/ditero

volumes:
  ditero-pg:
  ditero-zero:
  ditero-minio:
