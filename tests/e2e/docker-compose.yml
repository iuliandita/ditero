services:
  upstream-db:
    image: postgres:18@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
    environment:
      POSTGRES_DB: ditero_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    command: postgres -c wal_level=logical
    ports:
      - "55432:5432"
    healthcheck:
      # A real query over TCP, not pg_isready: initdb runs a temporary server on
      # a unix socket, so pg_isready reports ready from inside the container
      # before the real server has restarted to listen on TCP. Consumers then
      # connect and get FATAL 57P03 "the database system is starting up".
      test:
        [
          "CMD-SHELL",
          "psql -h 127.0.0.1 -U postgres -d ditero_e2e -c 'select 1' > /dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  zero-cache:
    image: rocicorp/zero:1.9.0@sha256:f80683bf3ddf08be26c68ddd94589fada29a0b8a4597668b090006c09041d4cd
    depends_on:
      upstream-db:
        condition: service_healthy
    ports:
      - "4849:4848"
    environment:
      ZERO_UPSTREAM_DB: postgres://postgres:pass@upstream-db:5432/ditero_e2e
      ZERO_CVR_DB: postgres://postgres:pass@upstream-db:5432/ditero_e2e
      ZERO_CHANGE_DB: postgres://postgres:pass@upstream-db:5432/ditero_e2e
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: e2eadmin
      ZERO_QUERY_URL: http://host.docker.internal:3000/api/zero/query
      ZERO_MUTATE_URL: http://host.docker.internal:3000/api/zero/mutate
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zero-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4848/keepalive || exit 1"]
      interval: 2s
      start_period: 30s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/ditero-test

volumes:
  zero-data:
  minio-data:
