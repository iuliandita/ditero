services:
  browser:
    profiles: [browser]
    image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    init: true
    user: pwuser
    shm_size: 1gb
    labels:
      io.ditero.e2e.run: ${DITERO_E2E_RUN_ID:-unmanaged}
    ports:
      - "127.0.0.1:${DITERO_E2E_BROWSER_PORT:-53000}:3000"
    volumes:
      - ../../node_modules/playwright-core:/opt/playwright-core:ro
      - ../../scripts/e2e-client-transport.cjs:/opt/e2e-client-transport.cjs:ro
    environment:
      NODE_ENV: test
      DITERO_E2E_SIGNUP_TRANSPORT: ${DITERO_E2E_SIGNUP_TRANSPORT:-0}
    command:
      [node, --require, /opt/e2e-client-transport.cjs, /opt/playwright-core/cli.js, run-server, --host, 0.0.0.0, --port, "3000"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s = require('node:net').connect(3000, '127.0.0.1', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));"
      interval: 1s
      timeout: 5s
      retries: 30

  upstream-db:
    image: postgres:18@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
    environment:
      POSTGRES_DB: ditero_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    command: postgres -c wal_level=logical
    volumes:
      - postgres-data:/var/lib/postgresql
    labels:
      io.ditero.e2e.run: ${DITERO_E2E_RUN_ID:-unmanaged}
    ports:
      - "127.0.0.1:${DITERO_E2E_DB_PORT:-55432}:5432"
    healthcheck:
      # A real query over TCP, not pg_isready: initdb runs a temporary server on
      # a unix socket, so pg_isready reports ready from inside the container
      # before the real server has restarted to listen on TCP. Consumers then
      # connect and get FATAL 57P03 "the database system is starting up".
      test:
        [
          "CMD-SHELL",
          "psql -h 127.0.0.1 -U postgres -d ditero_e2e -c 'select 1' > /dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  zero-cache:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: zero-runtime
    depends_on:
      upstream-db:
        condition: service_healthy
    labels:
      io.ditero.e2e.run: ${DITERO_E2E_RUN_ID:-unmanaged}
    ports:
      - "127.0.0.1:${DITERO_E2E_ZERO_PORT:-4849}:4848"
    environment:
      ZERO_UPSTREAM_DB: postgres://postgres:pass@upstream-db:5432/ditero_e2e
      ZERO_CVR_DB: postgres://postgres:pass@upstream-db:5432/ditero_e2e
      ZERO_CHANGE_DB: postgres://postgres:pass@upstream-db:5432/ditero_e2e
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: e2eadmin
      ZERO_QUERY_URL: http://host.docker.internal:${DITERO_E2E_API_PORT:-3000}/api/zero/query
      ZERO_MUTATE_URL: http://host.docker.internal:${DITERO_E2E_API_PORT:-3000}/api/zero/mutate
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zero-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4848/keepalive || exit 1"]
      interval: 2s
      start_period: 30s
      retries: 30

  minio:
    image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    entrypoint: /usr/bin/weed
    command:
      - -logtostderr=true
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=256
      - -volume.max=4
      - -filer
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -ip=minio
      - -ip.bind=0.0.0.0
    labels:
      io.ditero.e2e.run: ${DITERO_E2E_RUN_ID:-unmanaged}
    environment:
      GODEBUG: fips140=on
      WEED_MASTER_VOLUME_GROWTH_COPY_1: "1"
      WEED_MASTER_VOLUME_GROWTH_COPY_2: "1"
      WEED_MASTER_VOLUME_GROWTH_COPY_3: "1"
      WEED_MASTER_VOLUME_GROWTH_COPY_OTHER: "1"
    ports:
      - "127.0.0.1:${DITERO_TEST_MINIO_PORT:-59000}:9000"
    volumes:
      - minio-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--aws-sigv4", "aws:amz:us-east-1:s3", "--user", "minioadmin:minioadmin", "http://localhost:9000/"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
      - /data:rw,noexec,nosuid,size=1m,uid=1000,gid=1000
    depends_on:
      minio:
        condition: service_healthy
    labels:
      io.ditero.e2e.run: ${DITERO_E2E_RUN_ID:-unmanaged}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        buckets=$$(printf 's3.bucket.list\n' | /usr/bin/weed shell -master=minio:9333 -filer=minio:8888);
        if ! printf '%s\n' "$$buckets" | grep -Eq '^  ditero-test[[:space:]]'; then
          printf 's3.bucket.create -name ditero-test -owner test-admin\n' |
            /usr/bin/weed shell -master=minio:9333 -filer=minio:8888;
        fi

volumes:
  postgres-data:
    labels:
      io.ditero.e2e.run: ${DITERO_E2E_RUN_ID:-unmanaged}
  zero-data:
    labels:
      io.ditero.e2e.run: ${DITERO_E2E_RUN_ID:-unmanaged}
  minio-data:
    labels:
      io.ditero.e2e.run: ${DITERO_E2E_RUN_ID:-unmanaged}

networks:
  default:
    labels:
      io.ditero.e2e.run: ${DITERO_E2E_RUN_ID:-unmanaged}
